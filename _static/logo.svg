<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Data Science Portfolio logo: a 3-2-1 neural network">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="96" height="96" rx="22" fill="url(#tile)"/>
  <!-- edges: input (3) -> hidden (2) -->
  <g stroke="#FFFFFF" stroke-opacity=".38" stroke-width="1.8" stroke-linecap="round">
    <line x1="24" y1="28" x2="48" y2="38"/><line x1="24" y1="28" x2="48" y2="58"/>
    <line x1="24" y1="48" x2="48" y2="38"/><line x1="24" y1="48" x2="48" y2="58"/>
    <line x1="24" y1="68" x2="48" y2="38"/><line x1="24" y1="68" x2="48" y2="58"/>
  </g>
  <!-- edges: hidden (2) -> output (1) -->
  <g stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
    <line x1="48" y1="38" x2="72" y2="48"/><line x1="48" y1="58" x2="72" y2="48"/>
  </g>
  <!-- nodes -->
  <g fill="#FFFFFF">
    <circle cx="24" cy="28" r="6"/><circle cx="24" cy="48" r="6"/><circle cx="24" cy="68" r="6"/>
  </g>
  <g fill="#E0E7FF">
    <circle cx="48" cy="38" r="6.5"/><circle cx="48" cy="58" r="6.5"/>
  </g>
  <circle cx="72" cy="48" r="8" fill="url(#out)"/>
</svg>
